<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30秒連點對決 - 玩家 vs AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        /* 按鈕點擊震撼動畫 */
        @keyframes clickPulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .btn-active {
            animation: clickPulse 0.08s ease-out;
        }
        /* 浮動數字特效 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }
        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            font-weight: 900;
        }
        /* 霓虹光暈 */
        .glow-player {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }
        .glow-ai {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }
        /* 進度條平滑過渡 */
        .progress-bar-inner {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between items-center p-4 overflow-x-hidden relative">

    <!-- 背景動態網格裝飾 -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] -z-10"></div>

    <!-- 頂部標題列 -->
    <header class="w-full max-w-xl flex justify-between items-center mt-2 mb-4 px-2">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-3xl text-amber-400 animate-bounce"></i>
            <h1 class="text-2xl sm:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-orange-500 to-red-500">
                30s 連點速對決
            </h1>
        </div>
        <!-- 音效開關 -->
        <button id="soundToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl flex items-center space-x-2 transition border border-slate-700">
            <i id="soundIcon" class="fa-solid fa-volume-high"></i>
            <span id="soundText" class="text-xs font-bold sm:inline hidden">音效: 開</span>
        </button>
    </header>

    <!-- 主遊戲內容卡片 -->
    <main class="w-full max-w-xl bg-slate-800/80 backdrop-blur-md rounded-3xl p-5 sm:p-6 shadow-2xl border border-slate-700/60 flex flex-col items-center relative">

        <!-- 遊戲狀態/倒數計時器 -->
        <div class="w-full bg-slate-900/90 rounded-2xl p-4 mb-6 border border-slate-700 text-center relative overflow-hidden">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">剩餘時間 (SECONDS)</div>
            <div id="timerDisplay" class="text-5xl sm:text-6xl font-fredoka text-amber-400 tracking-wider">
                30.0
            </div>
            <!-- 時間進度條 -->
            <div class="w-full bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                <div id="timerBar" class="bg-gradient-to-r from-amber-500 to-red-500 h-full w-full transition-all duration-100"></div>
            </div>
        </div>

        <!-- 數據對比與進度條 -->
        <div class="w-full space-y-4 mb-6">
            <!-- 玩家進度條 -->
            <div class="bg-slate-900/60 p-3 sm:p-4 rounded-2xl border border-blue-500/30 glow-player">
                <div class="flex justify-between items-center mb-1.5">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                        <span class="font-bold text-blue-400 text-sm sm:text-base">你的點擊 (PLAYER)</span>
                    </div>
                    <div class="text-right">
                        <span id="playerScore" class="text-2xl sm:text-3xl font-fredoka text-blue-400">0</span>
                        <span class="text-xs text-slate-400 ml-1">次</span>
                    </div>
                </div>
                <!-- 玩家進度條槽 -->
                <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
                    <div id="playerProgressBar" class="progress-bar-inner bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-full w-0"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-400 mt-1 font-mono">
                    <span>CPS: <span id="playerCPS" class="text-blue-300 font-bold">0.0</span></span>
                    <span>最高 CPS: <span id="playerMaxCPS" class="text-blue-300 font-bold">0.0</span></span>
                </div>
            </div>

            <!-- AI進度條 -->
            <div class="bg-slate-900/60 p-3 sm:p-4 rounded-2xl border border-red-500/30 glow-ai">
                <div class="flex justify-between items-center mb-1.5">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                        <span class="font-bold text-red-400 text-sm sm:text-base">電腦 AI (約 5 次/秒)</span>
                    </div>
                    <div class="text-right">
                        <span id="aiScore" class="text-2xl sm:text-3xl font-fredoka text-red-400">0</span>
                        <span class="text-xs text-slate-400 ml-1">次</span>
                    </div>
                </div>
                <!-- AI進度條槽 -->
                <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
                    <div id="aiProgressBar" class="progress-bar-inner bg-gradient-to-r from-red-600 to-orange-400 h-full rounded-full w-0"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-400 mt-1 font-mono">
                    <span>CPS: <span id="aiCPS" class="text-red-300 font-bold">0.0</span></span>
                    <span>目標: ~150 次/30s</span>
                </div>
            </div>
        </div>

        <!-- 連點點擊區域 -->
        <div class="w-full relative flex flex-col items-center justify-center my-2">
            <!-- 浮動文字特效容器 -->
            <div id="clickEffectContainer" class="absolute inset-0 pointer-events-none z-20"></div>

            <!-- 主點擊按鈕 -->
            <button id="clickBtn" disabled class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-gradient-to-b from-blue-500 via-indigo-600 to-blue-800 text-white font-black text-2xl shadow-[0_10px_0_#1e3a8a,0_15px_25px_rgba(0,0,0,0.5)] active:shadow-[0_2px_0_#1e3a8a,0_5px_10px_rgba(0,0,0,0.5)] active:translate-y-2 transition-all cursor-pointer flex flex-col items-center justify-center border-4 border-blue-300 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden">
                <i class="fa-solid fa-hand-pointer text-4xl mb-2 group-hover:scale-110 transition-transform"></i>
                <span id="clickBtnText" class="text-xl sm:text-2xl font-bold tracking-wider">準備好了嗎？</span>
            </button>

            <p class="text-xs text-slate-400 mt-4 text-center">
                提示：點擊開始遊戲按鈕後，請用最快速度狂點上方藍色圓圈！
            </p>
        </div>

        <!-- 開始 / 重來按鈕 -->
        <div class="w-full mt-4">
            <button id="startBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-slate-900 font-black text-xl shadow-lg shadow-green-500/20 active:scale-[0.98] transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play text-2xl"></i>
                <span>開始比賽！</span>
            </button>
        </div>
    </main>

    <!-- 遊戲結束結算彈窗 (Modal) -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modalContent">
            
            <div id="resultBadge" class="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 bg-amber-500/20 text-amber-400 border border-amber-500/40">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <h2 id="resultTitle" class="text-3xl font-black mb-2 text-white">挑戰結果</h2>
            <p id="resultSubtitle" class="text-slate-300 text-sm mb-6">你與電腦 AI 完成了 30 秒的激烈比賽！</p>

            <!-- 數據結算卡片 -->
            <div class="bg-slate-900/90 rounded-2xl p-4 mb-6 border border-slate-700 space-y-3 font-mono text-sm">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400">你的點擊數:</span>
                    <span id="modalPlayerClicks" class="text-blue-400 font-bold text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400">AI 電腦點擊數:</span>
                    <span id="modalAIClicks" class="text-red-400 font-bold text-lg">0 次</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400">勝負差距:</span>
                    <span id="modalDiff" class="text-emerald-400 font-bold text-lg">+0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400">平均點擊速度:</span>
                    <span id="modalAvgCPS" class="text-amber-400 font-bold text-lg">0.0 CPS</span>
                </div>
            </div>

            <!-- 再試一次按鈕 -->
            <button id="modalRestartBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-bold text-lg shadow-lg shadow-indigo-500/30 active:scale-[0.98] transition">
                <i class="fa-solid fa-rotate-right mr-2"></i>再挑戰一次
            </button>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="mt-4 text-xs text-slate-500 text-center">
        30-Second Rapid Click Challenge &copy; HTML5 / Web Audio API Game
    </footer>

    <!-- 遊戲邏輯 JavaScript -->
    <script>
        // --- 遊戲變數與狀態 ---
        const GAME_DURATION = 30; // 30 秒
        const AI_BASE_CPS = 5.0; // AI 基本每秒點擊 5 下

        let timer = GAME_DURATION;
        let timerInterval = null;
        let aiTimeout = null;
        let cpsInterval = null;

        let playerScore = 0;
        let aiScore = 0;
        let isPlaying = false;

        let soundEnabled = true;

        // CPS 計算變數
        let clicksInLastSecond = 0;
        let currentCPS = 0;
        let maxCPS = 0;

        // --- DOM 元素獲取 ---
        const timerDisplay = document.getElementById('timerDisplay');
        const timerBar = document.getElementById('timerBar');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const playerProgressBar = document.getElementById('playerProgressBar');
        const aiProgressBar = document.getElementById('aiProgressBar');
        const playerCPSEl = document.getElementById('playerCPS');
        const playerMaxCPSEl = document.getElementById('playerMaxCPS');
        const aiCPSEl = document.getElementById('aiCPS');
        
        const clickBtn = document.getElementById('clickBtn');
        const clickBtnText = document.getElementById('clickBtnText');
        const startBtn = document.getElementById('startBtn');

        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        // Modal 元素
        const resultModal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const resultBadge = document.getElementById('resultBadge');
        const resultTitle = document.getElementById('resultTitle');
        const resultSubtitle = document.getElementById('resultSubtitle');
        const modalPlayerClicks = document.getElementById('modalPlayerClicks');
        const modalAIClicks = document.getElementById('modalAIClicks');
        const modalDiff = document.getElementById('modalDiff');
        const modalAvgCPS = document.getElementById('modalAvgCPS');
        const modalRestartBtn = document.getElementById('modalRestartBtn');

        // --- Web Audio API 音效生成器 (無須外部檔案) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 播放合成音效
        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                // 輕快打擊聲
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450 + Math.random() * 200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'countdown') {
                // 倒數嗶嗶聲
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'win') {
                // 勝利和弦
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const oscW = audioCtx.createOscillator();
                    const gainW = audioCtx.createGain();
                    oscW.connect(gainW);
                    gainW.connect(audioCtx.destination);
                    oscW.type = 'triangle';
                    oscW.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gainW.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gainW.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    oscW.start(now + idx * 0.08);
                    oscW.stop(now + idx * 0.08 + 0.3);
                });
            } else if (type === 'lose') {
                // 失敗音效
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- 音效切換 ---
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high";
                soundText.textContent = "音效: 開";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-red-400";
                soundText.textContent = "音效: 關";
            }
        });

        // --- 浮動文字特效 ---
        function createClickEffect(e) {
            const rect = clickBtn.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else if (e.clientX) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            } else {
                x = rect.width / 2;
                y = rect.height / 2;
            }

            const floatEl = document.createElement('div');
            floatEl.className = 'float-text text-amber-300 text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]';
            floatEl.style.left = `${x}px`;
            floatEl.style.top = `${y}px`;
            floatEl.textContent = '+1';

            clickBtn.appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 600);
        }

        // --- 更新進度條與視覺比例 ---
        function updateProgress() {
            playerScoreEl.textContent = playerScore;
            aiScoreEl.textContent = aiScore;

            // 動態對比進度條 (預設基準為 150，過高則擴增)
            const maxVal = Math.max(playerScore, aiScore, 150);
            const playerPct = Math.min((playerScore / maxVal) * 100, 100);
            const aiPct = Math.min((aiScore / maxVal) * 100, 100);

            playerProgressBar.style.width = `${playerPct}%`;
            aiProgressBar.style.width = `${aiPct}%`;
        }

        // --- 玩家按鈕點擊事件 ---
        function handlePlayerClick(e) {
            if (!isPlaying) return;

            playerScore++;
            clicksInLastSecond++;
            playSound('click');
            createClickEffect(e);
            updateProgress();

            // 按鈕動態回饋
            clickBtn.classList.remove('btn-active');
            void clickBtn.offsetWidth;
            clickBtn.classList.add('btn-active');
        }

        clickBtn.addEventListener('mousedown', (e) => {
            if (e.button === 0) handlePlayerClick(e);
        });

        clickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePlayerClick(e);
        }, { passive: false });

        // --- AI 電腦連點邏輯 ---
        function startAILogic() {
            function scheduleNextAIClick() {
                if (!isPlaying) return;

                aiScore++;
                updateProgress();

                // 平均 200ms (每秒5下) 帶有微妙亂數波動 (160ms ~ 240ms)
                const randomDelay = 200 + (Math.random() * 80 - 40);
                aiTimeout = setTimeout(scheduleNextAIClick, randomDelay);
            }

            scheduleNextAIClick();
        }

        // --- CPS (每秒點擊率) 計算器 ---
        function startCPSCalculator() {
            cpsInterval = setInterval(() => {
                if (!isPlaying) return;

                currentCPS = clicksInLastSecond;
                if (currentCPS > maxCPS) {
                    maxCPS = currentCPS;
                }

                playerCPSEl.textContent = currentCPS.toFixed(1);
                playerMaxCPSEl.textContent = maxCPS.toFixed(1);

                // AI CPS 顯示
                const aiDisplayCPS = (AI_BASE_CPS + (Math.random() * 0.6 - 0.3)).toFixed(1);
                aiCPSEl.textContent = aiDisplayCPS;

                clicksInLastSecond = 0;
            }, 1000);
        }

        // --- 啟動遊戲 ---
        function startGame() {
            initAudio();

            // 重置數據
            playerScore = 0;
            aiScore = 0;
            timer = GAME_DURATION;
            clicksInLastSecond = 0;
            currentCPS = 0;
            maxCPS = 0;
            isPlaying = true;

            // UI 狀態更新
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            playerCPSEl.textContent = '0.0';
            playerMaxCPSEl.textContent = '0.0';
            aiCPSEl.textContent = '5.0';
            playerProgressBar.style.width = '0%';
            aiProgressBar.style.width = '0%';

            clickBtn.disabled = false;
            clickBtnText.textContent = '狂點這裡！';
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 啟動倒數計時器
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, GAME_DURATION - elapsed);
                timer = remaining;

                timerDisplay.textContent = remaining.toFixed(1);
                timerBar.style.width = `${(remaining / GAME_DURATION) * 100}%`;

                if (remaining <= 5 && remaining > 0) {
                    if (Math.floor(remaining * 10) % 10 === 0) {
                        playSound('countdown');
                    }
                }

                if (remaining <= 0) {
                    endGame();
                }
            }, 50);

            // 啟動 AI 與 CPS 計算
            startAILogic();
            startCPSCalculator();
        }

        // --- 結束遊戲與結果顯示 ---
        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(aiTimeout);
            clearInterval(cpsInterval);

            clickBtn.disabled = true;
            clickBtnText.textContent = '對決結束！';
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            timerDisplay.textContent = '0.0';
            timerBar.style.width = '0%';

            // 計算勝負數據
            const diff = playerScore - aiScore;
            const avgCPS = (playerScore / GAME_DURATION).toFixed(2);

            modalPlayerClicks.textContent = `${playerScore} 次`;
            modalAIClicks.textContent = `${aiScore} 次`;
            modalAvgCPS.textContent = `${avgCPS} 次/秒`;

            if (diff > 0) {
                // 玩家獲勝
                resultBadge.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
                resultBadge.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                resultTitle.textContent = "恭喜！你贏了！";
                resultTitle.className = "text-3xl font-black mb-2 text-emerald-400";
                resultSubtitle.textContent = `你的手速成功擊敗了電腦 AI！`;
                modalDiff.textContent = `多點了 ${diff} 下`;
                modalDiff.className = "text-emerald-400 font-bold text-lg";
                playSound('win');
            } else if (diff < 0) {
                // AI 獲勝
                resultBadge.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 bg-red-500/20 text-red-400 border border-red-500/40";
                resultBadge.innerHTML = '<i class="fa-solid fa-robot"></i>';
                resultTitle.textContent = "遺憾！電腦 AI 獲勝！";
                resultTitle.className = "text-3xl font-black mb-2 text-red-400";
                resultSubtitle.textContent = `電腦 AI 展現了穩定的 5 次/秒極限輸出！`;
                modalDiff.textContent = `少點了 ${Math.abs(diff)} 下`;
                modalDiff.className = "text-red-400 font-bold text-lg";
                playSound('lose');
            } else {
                // 平手
                resultBadge.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl mb-4 bg-amber-500/20 text-amber-400 border border-amber-500/40";
                resultBadge.innerHTML = '<i class="fa-solid fa-handshake"></i>';
                resultTitle.textContent = "勢均力敵！平手！";
                resultTitle.className = "text-3xl font-black mb-2 text-amber-400";
                resultSubtitle.textContent = `你與電腦 AI 點擊次數完全一致！`;
                modalDiff.textContent = `完全平手 (0)`;
                modalDiff.className = "text-amber-400 font-bold text-lg";
                playSound('win');
            }

            // 顯示 Modal 彈窗
            setTimeout(() => {
                resultModal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
            }, 300);
        }

        // --- 關閉結算 Modal ---
        function closeModal() {
            resultModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }

        // --- 按鈕監聽事件 ---
        startBtn.addEventListener('click', startGame);

        modalRestartBtn.addEventListener('click', () => {
            closeModal();
            setTimeout(startGame, 300);
        });
    </script>
</body>
</html>
